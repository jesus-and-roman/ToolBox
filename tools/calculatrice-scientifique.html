<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculatrice scientifique — Atelier</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .keypad.sci { grid-template-columns: repeat(5, 1fr); }
  .key.small { font-size: 0.85rem; }
</style>
</head>
<body>

<header class="tool-header">
  <a class="back-link" href="../index.html" id="backLink"></a>
  <div class="breadcrumb">Calculs / <strong>Calculatrice scientifique</strong></div>
  <div class="header-spacer"></div>
  <button class="theme-toggle" id="themeToggle"></button>
</header>

<main class="tool-main">
  <h1>Calculatrice scientifique</h1>
  <p class="tool-desc">Fonctions trigonométriques, logarithmes, puissances et racines. Les angles sont en degrés.</p>

  <div class="panel">
    <div class="calc-display">
      <div class="prev" id="expr">&nbsp;</div>
      <div class="curr" id="curr">0</div>
    </div>
    <div class="keypad sci" id="keypad">
      <button class="key small" data-k="sin(">sin</button>
      <button class="key small" data-k="cos(">cos</button>
      <button class="key small" data-k="tan(">tan</button>
      <button class="key small" data-k="log(">log</button>
      <button class="key small" data-k="ln(">ln</button>

      <button class="key small" data-k="sqrt(">√</button>
      <button class="key small" data-k="^">x^y</button>
      <button class="key small" data-k="(">(</button>
      <button class="key small" data-k=")">)</button>
      <button class="key small" data-k="pi">π</button>

      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key op" data-k="/">÷</button>
      <button class="key" data-k="C">C</button>

      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key op" data-k="*">×</button>
      <button class="key" data-k="back">⌫</button>

      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key op" data-k="-">−</button>
      <button class="key small" data-k="!">x!</button>

      <button class="key wide" data-k="0">0</button>
      <button class="key" data-k=".">,</button>
      <button class="key op" data-k="+">+</button>
      <button class="key equals" data-k="=">=</button>
    </div>
  </div>
</main>

<script src="../js/icons.js"></script>
<script src="../js/common.js"></script>
<script>
  document.getElementById("backLink").innerHTML = icon("back") + " Accueil";
  initThemeToggle("themeToggle");

  const exprEl = document.getElementById("expr");
  const currEl = document.getElementById("curr");
  let expr = "";

  function factorial(n) {
    if (n < 0 || Math.floor(n) !== n) return NaN;
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
  }

  function evaluate(raw) {
    // Convertit en JS : ^ -> **, sin/cos/tan en degrés, ! géré à part, virgule -> point
    let s = raw.replace(/,/g, ".").replace(/\^/g, "**").replace(/pi/g, "Math.PI");
    s = s.replace(/(\d+(\.\d+)?)!/g, (_, n) => `fact(${n})`);
    s = s.replace(/sin\(/g, "sind(").replace(/cos\(/g, "cosd(").replace(/tan\(/g, "tand(");
    s = s.replace(/log\(/g, "Math.log10(").replace(/ln\(/g, "Math.log(").replace(/sqrt\(/g, "Math.sqrt(");
    const sind = (x) => Math.sin(x * Math.PI / 180);
    const cosd = (x) => Math.cos(x * Math.PI / 180);
    const tand = (x) => Math.tan(x * Math.PI / 180);
    const fact = factorial;
    return Function("sind", "cosd", "tand", "fact", `"use strict"; return (${s})`)(sind, cosd, tand, fact);
  }

  function paint() {
    exprEl.textContent = expr || "\u00a0";
  }

  document.getElementById("keypad").addEventListener("click", e => {
    const k = e.target.dataset.k;
    if (!k) return;

    if (k === "C") { expr = ""; currEl.textContent = "0"; }
    else if (k === "back") { expr = expr.slice(0, -1); }
    else if (k === "=") {
      try {
        const val = evaluate(expr);
        currEl.textContent = isFinite(val) ? parseFloat(val.toPrecision(12)).toString().replace(".", ",") : "Erreur";
      } catch { currEl.textContent = "Erreur"; }
    } else if (k === ".") {
      expr += ",";
    } else {
      expr += k;
    }
    paint();
  });

  paint();
</script>
</body>
</html>
